name: starter_ui
description: >-
  Shared presentation toolkit: reusable widgets, dialogs, snackbars, clippers,
  error UI, the custom map, theming, navigation animations and route helpers,
  plus UI constants and colors. App-specific runtime state (context, language,
  routing) is injected through UiRuntime rather than imported.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Monorepo packages
  starter_core:
    path: ../starter_core
  starter_infra:
    path: ../starter_infra
  starter_localization:
    path: ../starter_localization

  # Layout / theming
  flutter_screenutil: ^5.9.0
  google_fonts: ^8.0.2
  animated_theme_switcher: ^2.0.8

  # Widgets / feedback
  shimmer: ^3.0.0
  fluttertoast: ^8.2.1
  another_flushbar: ^1.12.30
  pull_to_refresh_flutter3: ^2.0.1
  pin_code_fields: ^8.0.1
  animated_text_kit: ^4.2.2
  visibility_detector: ^0.4.0+2
  lottie: ^2.2.0
  flutter_svg: ^2.0.2
  cached_network_image: ^3.4.1
  clippy_flutter: ^2.0.0-nullsafety.1

  # State management used by UI cubits
  flutter_bloc: ^8.1.2
  provider: ^6.0.5

  # Navigation
  go_router: ^12.0.0

  # Map
  google_maps_flutter: ^2.17.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  flutter_polyline_points: ^3.1.0

  # Misc
  url_launcher: ^6.3.2
  intl: ^0.20.2
  dio: ^5.3.3
  dartz: ^0.10.1
  get_it: ^7.2.0
  injectable: ^2.1.0
  freezed_annotation: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  freezed: ^2.3.2
